<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EscapeMesh — Smart IoT Fire Evacuation Mesh Network Simulator" />
  <title>EscapeMesh — IoT Evacuation Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-left">
      <span class="logo-icon">🔥</span>
      <h1>EscapeMesh</h1>
      <span class="subtitle">IoT Evacuation Simulator</span>
    </div>
    <div class="header-right">
      <!-- Mode Selection -->
      <div class="editor-modes">
        <button id="btn-mode-inspect" class="btn btn-ghost active">🔍 Inspect</button>
        <button id="btn-mode-edit" class="btn btn-ghost">🛠️ Edit Mode</button>
      </div>
      
      <!-- Save/Revert Actions -->
      <div id="editor-actions" style="display: none; gap: 6px;">
        <button id="btn-topo-save" class="btn btn-primary" style="background: linear-gradient(135deg, #059669, #047857);">💾 Save</button>
        <button id="btn-topo-revert" class="btn btn-ghost">↩ Revert</button>
      </div>

      <select id="protocol-select">
        <option value="gradient">Gradient Field</option>
        <option value="link_state">Link-State</option>
        <option value="dsdv">DSDV</option>
        <option value="aodv">AODV</option>
        <option value="potential_field">Potential Field</option>
        <option value="rpl">RPL (DODAG)</option>
      </select>
      <button id="btn-converge" class="btn btn-primary">▶ Converge</button>
      <button id="btn-reset" class="btn btn-ghost">↺ Reset</button>
    </div>
  </header>

  <!-- Main Content -->
  <div id="main">
    <!-- Floor Navigation Pills -->
    <nav id="floor-nav">
      <button class="floor-pill active" data-floor="0">Ground</button>
      <button class="floor-pill" data-floor="1">Floor 1</button>
      <button class="floor-pill" data-floor="2">Floor 2</button>
      <button class="floor-pill" data-floor="3">Floor 3</button>
      <button class="floor-pill" data-floor="4">Floor 4</button>
      <button class="floor-pill" data-floor="5">Floor 5</button>
    </nav>

    <div id="content-area">
      <!-- SVG Floor Viewport -->
      <div id="floor-viewport">
        <div id="floor-slider">
          <!-- 5 floor SVGs will be injected here by JS -->
        </div>
      </div>

      <!-- Info Sidebar -->
      <aside id="info-panel">
        <div class="panel-section">
          <h3>Status</h3>
          <div id="status-display">
            <div class="status-row"><span class="status-label">Protocol</span><span id="status-protocol" class="status-value">—</span></div>
            <div class="status-row"><span class="status-label">State</span><span id="status-state" class="status-value">Idle</span></div>
            <div class="status-row"><span class="status-label">Tick</span><span id="status-tick" class="status-value">—</span></div>
          </div>
        </div>

        <div class="panel-section">
          <h3>Hardware Suitability</h3>
          <div id="hardware-suitability">
            <p class="hint">Select a protocol to inspect</p>
          </div>
        </div>

        <div class="panel-section">
          <h3>Floor Network Analysis</h3>
          <div id="floor-analysis">
            <p class="hint">Select a floor and run convergence</p>
          </div>
        </div>

        <div class="panel-section">
          <h3>Selected Node</h3>
          <div id="node-info">
            <p class="hint">Hover or click a node to select</p>
          </div>
          <!-- Dynamic MQ2 Sensor & Connector Controls (Hidden by default, shown when node selected) -->
          <div id="node-config-panel" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(16,185,129,0.15); gap: 10px; flex-direction: column;">
            <div class="setting-row">
              <label for="node-smoke-level">MQ2 Gas PPM: <span id="val-node-smoke">100</span></label>
              <input type="range" id="node-smoke-level" min="100" max="1000" value="100" step="50" />
            </div>
            <div class="setting-row">
              <label for="node-smoke-threshold">MQ2 Threshold (PPM):</label>
              <input type="number" id="node-smoke-threshold" min="200" max="800" value="400" style="padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent); background: rgba(15,23,42,0.6); color: #fff; font-family: inherit; font-size: 11px;" />
            </div>
            <div id="stairs-connector-row" class="setting-row" style="display: none; flex-direction: column; gap: 4px;">
              <label for="node-stairs-select">Stairs Connection (Cross-Floor):</label>
              <div style="display: flex; gap: 4px;">
                <select id="node-stairs-select" style="flex: 1; padding: 4px; border-radius: 4px; border: 1px solid var(--accent); background: rgba(15,23,42,0.6); color: #fff; font-size: 11px;"></select>
                <button id="btn-stairs-connect" class="btn btn-primary" style="padding: 4px 8px; font-size: 11px;">Link</button>
              </div>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h3>Floor Routing Table</h3>
          <div id="routing-table">
            <p class="hint">Run convergence first</p>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip" class="tooltip hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
